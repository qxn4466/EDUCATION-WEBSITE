  # Job 2: Deploy (ONLY on push AFTER merge)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Oracle VM
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Frontend ARM64 Image
        run: |
          docker buildx build --platform linux/arm64 \
            -f frontend/Dockerfile \
            -t education-frontend:arm64 \
            --load \
            .
          docker save education-frontend:arm64 -o frontend-image.tar
          echo "Frontend image size:"
          ls -lh frontend-image.tar

      - name: Build Backend ARM64 Image
        run: |
          docker buildx build --platform linux/arm64 \
            -f backend/Dockerfile \
            -t education-backend:arm64 \
            --load \
            .
          docker save education-backend:arm64 -o backend-image.tar
          echo "Backend image size:"
          ls -lh backend-image.tar

      - name: Verify images exist
        run: |
          if [ ! -f frontend-image.tar ] || [ ! -f backend-image.tar ]; then
            echo "❌ Docker images not found!"
            exit 1
          fi
          echo "✅ Images ready for upload"

      - name: Upload Docker Images to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "frontend-image.tar,backend-image.tar,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}/"

      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.VM_USER }}
            ls -lh *.tar
            docker load -i frontend-image.tar
            docker load -i backend-image.tar
            docker tag education-frontend:arm64 education-website_frontend:latest
            docker tag education-backend:arm64 education-website_backend:latest
            cd ~/education-website
            docker-compose down
            docker-compose up -d
            docker ps